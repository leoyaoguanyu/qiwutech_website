# ============================================================
# 启物科技官网 Nginx 配置（阿里云 ECS）
# 放到 /etc/nginx/sites-available/inspireomni.conf 并软链到 sites-enabled
# 把 your-domain.com 换成实际域名；HTTPS 部分在申请证书后取消注释
# ============================================================

# 限制同一 IP 对 API 的请求频率（应用层还有一道 express-rate-limit）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream inspireomni_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # 申请到证书后，把下面一行取消注释，让 HTTP 全部跳转 HTTPS
    # return 301 https://$host$request_uri;

    include /etc/nginx/snippets/inspireomni-site.conf;
}

