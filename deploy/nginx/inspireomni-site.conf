# 站点公共部分：被 80 / 443 两个 server 块 include
# 放到 /etc/nginx/snippets/inspireomni-site.conf

root /var/www/inspireomni/client/dist;
index index.html;

# 日志
access_log /var/log/nginx/inspireomni.access.log;
error_log  /var/log/nginx/inspireomni.error.log warn;

# 安全头
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# gzip
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

# 请求体上限（联系表单很小，API 层限制为 32kb）
client_max_body_size 1m;

# ---------- API 反向代理到 Node ----------
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://inspireomni_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# ---------- 带 hash 的构建产物：长期缓存 ----------
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---------- 图片 / 视频 / 图标 ----------
location ~* \.(?:png|jpe?g|gif|ico|svg|webp|webm|mp4|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    # 大视频支持 Range 请求（拖动进度条）
    sendfile on;
    tcp_nopush on;
    try_files $uri =404;
}

# ---------- 前端路由（SPA）：找不到文件就回退到 index.html ----------
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

# 屏蔽隐藏文件
location ~ /\. {
    deny all;
}
